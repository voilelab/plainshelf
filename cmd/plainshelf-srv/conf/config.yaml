logger:
  level: info  # log level: debug, info, warn, error
  format: json # log format: json, text
  log_file:
    type: stderr

server_conf:
  addr: "127.0.0.1:20000"
  read_timeout: 60s
  # For SMB-mounted shelves with large books, increase write_timeout (e.g. 300s)
  # to avoid responses being cut off mid-transfer on slow networks.
  write_timeout: 60s

app_conf:
  logger:
    level: info  # log level: debug, info, warn, error
    format: json # log format: json, text
    log_file:
      type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
      dir: ./logs
      prefix: root
      # Rotated files older than this are deleted on the next rotation.
      # Defaults to 30 days; set to 0 to keep every file. A value saved from
      # Settings -> Logs takes precedence over this one.
      # retention_days: 30
  shelves:
    - id: default_shelf
      name: Default Shelf
      logger:
        level: info  # log level: debug, info, warn, error
        format: json # log format: json, text
        log_file:
          type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
          dir: ./logs
          prefix: shelf
          # Rotated files older than this are deleted on the next rotation.
          # Defaults to 30 days; set to 0 to keep every file. A value saved from
          # Settings -> Logs takes precedence over this one.
          # retention_days: 30
      lib_root: "./shelf"
      # For SMB-mounted shelves, increase scan_interval to reduce network I/O (e.g. "10m").
      # scan_interval: 1m
      # For SMB mounts, set lock_timeout to prevent indefinite hangs on flock (default: 30s).
      # lock_timeout: 30s
  store_path: "./store"
  cover_to_jpg: true
  read_only: false
  security:
    mode: "local_token"
    protect_read: false
    token_header: "X-PlainShelf-Token"
    allow_missing_origin_with_token: true
    allowed_origins:
      - "http://127.0.0.1:20000"
      - "http://localhost:20000"
      - "http://127.0.0.1:5173"
      - "http://localhost:5173"
