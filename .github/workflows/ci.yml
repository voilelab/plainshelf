name: CI

on:
  push:
    branches:
      - dev
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test version resolver
        working-directory: .
        run: ./scripts/test-resolve-version.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check module boundaries
        run: npm run check-boundaries

      - name: Check unused exports
        run: npm run check-exports

      - name: Check style contracts
        run: npm run check-style-contracts

      - name: Check dependency licenses
        run: npm run check-licenses

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint main module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Lint desktop module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: desktop

      - name: Lint reader module
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: reader

  go:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Go 1.27 go test defaults to a ten-minute timeout (go help testflag).
      - name: Run tests
        run: go test -timeout 2m ./...

      - name: Run desktop tests
        run: cd desktop && go test -timeout 2m ./...

      - name: Run reader tests
        run: cd reader && go test -timeout 2m ./...

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E smoke tests
        working-directory: e2e
        run: npm run test:smoke

  wasm-demo:
    name: Wasm demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Go 1.27.3 wasm_exec.js reserves an 8 KiB region for argv and environment data and throws when it overflows.
      - name: Test browser-build Go packages
        run: >-
          env -i PATH="$(go env GOROOT)/lib/wasm:$PATH" HOME="$HOME"
          GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)"
          GOOS=js GOARCH=wasm go test ./server/store/

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build wasm demo
        run: cmd/plainshelf-wasm/build.sh workspace/wasm-demo

      - name: Run wasm demo smoke test
        run: node cmd/plainshelf-wasm/web/smoke.mjs workspace/wasm-demo wasm-demo.png

      - name: Build wasm demo under /demo/
        run: cmd/plainshelf-wasm/build.sh workspace/wasm-site /demo/

      - name: Run wasm demo smoke test under /demo/
        env:
          SMOKE_BASE: /demo/
        run: node cmd/plainshelf-wasm/web/smoke.mjs workspace/wasm-site wasm-demo-base.png

      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-demo-screenshot
          path: wasm-demo*.png
          if-no-files-found: ignore

  android:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [frontend, android-lib]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download Android Go library
        uses: actions/download-artifact@v8
        with:
          name: plainshelf-android-lib
          path: frontend/android/app/libs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync the web build into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  android-lib:
    name: Android Go library
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build and measure the library
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build-android-lib.sh build/android-lib

      - name: Upload library
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-android-lib
          path: |
            build/android-lib/plainshelf.aar
            build/android-lib/report.md
          if-no-files-found: ignore

  vulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: frontend
    # govulncheck default symbol scanning uses call-graph reachability and can report conservative false positives (govulncheck doc.go).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # govulncheck source mode loads and type-checks packages before scanning, requiring go:embed inputs (internal/scan/source.go).
      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      # govulncheck go/types cannot check packages using a newer Go language version than the scanner was built with (Go 1.27 go/types.Checker).
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      # govulncheck source mode analyzes the selected build configuration, including GOOS build constraints (govulncheck doc.go).
      - name: Scan main module (linux)
        if: ${{ !cancelled() }}
        env:
          GOOS: linux
          GOARCH: amd64
        run: govulncheck ./...

      - name: Scan main module (darwin)
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
          GOARCH: arm64
        run: govulncheck ./...

      - name: Scan desktop module (linux)
        if: ${{ !cancelled() }}
        env:
          GOOS: linux
          GOARCH: amd64
        run: cd desktop && govulncheck ./...

      - name: Scan desktop module (darwin)
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
          GOARCH: arm64
        run: cd desktop && govulncheck ./...

      - name: Scan reader module (linux)
        if: ${{ !cancelled() }}
        env:
          GOOS: linux
          GOARCH: amd64
        run: cd reader && govulncheck ./...

      - name: Scan reader module (darwin)
        if: ${{ !cancelled() }}
        env:
          GOOS: darwin
          GOARCH: arm64
        run: cd reader && govulncheck ./...

