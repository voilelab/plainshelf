name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string for a manual (non-publishing) build"
        required: false
        default: "dev"
  workflow_call:
    inputs:
      version:
        description: "Release tag, e.g. v0.11.0"
        required: true
        type: string
      ref:
        description: "Commit to build and tag"
        required: true
        type: string
      publish:
        description: "Create the tag and GitHub Release, and push the Docker image"
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  VERSION_PKG: github.com/voilelab/plainshelf/internal/version

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      native_version: ${{ steps.resolve.outputs.native_version }}
      android_name: ${{ steps.resolve.outputs.android_name }}
      android_code: ${{ steps.resolve.outputs.android_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve version string
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          set -euo pipefail
          raw_version="${INPUT_VERSION:-dev}"
          if [ "$PUBLISH" = "true" ]; then
            ./scripts/resolve-version.sh validate-tag "$raw_version"
          fi

          version=$(./scripts/resolve-version.sh display "$raw_version")
          native_version=$(./scripts/resolve-version.sh native "$raw_version")
          android_name=$(./scripts/resolve-version.sh android-name "$raw_version")
          if ! android_code=$(./scripts/resolve-version.sh android-code "$raw_version"); then
            [ "$PUBLISH" != "true" ] || exit 1
            android_code=1
          fi
          {
            echo "version=${version}"
            echo "native_version=${native_version}"
            echo "android_name=${android_name}"
            echo "android_code=${android_code}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"
          echo "Native version: ${native_version}"
          echo "Android version: ${android_name} (${android_code})"

  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  test:
    name: Go tests
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install Wails v3 Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Run desktop tests
        run: cd desktop && go test ./...

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [prepare, frontend, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          bin="plainshelf-srv"

          go build -trimpath \
            -ldflags "-s -w -X ${VERSION_PKG}.Version=${VERSION}" \
            -o "build/${bin}" ./cmd/plainshelf-srv

          stage="stage"
          mkdir -p "$stage"
          cp "build/${bin}" "$stage/"
          cp LICENSE README.md "$stage/"
          cp image.png "$stage/"
          cp -R docs "$stage/"
          cp cmd/plainshelf-srv/conf/config.yaml "$stage/config.sample.yaml"

          name="plainshelf_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p out
          tar -czf "out/${name}.tar.gz" -C "$stage" .

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          if-no-files-found: error

  desktop-mac:
    name: Build desktop darwin/arm64
    needs: [prepare, frontend, test]
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: desktop/go.sum

      - name: Build Wails .app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NATIVE_VERSION: ${{ needs.prepare.outputs.native_version }}
          CGO_CFLAGS: -mmacosx-version-min=13.0
          CGO_LDFLAGS: -mmacosx-version-min=13.0
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        working-directory: desktop
        run: |
          set -euo pipefail
          go mod tidy
          go tool wails3 task package:darwin VERSION="${VERSION}"

          plist="build/bin/PlainShelf.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NATIVE_VERSION}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NATIVE_VERSION}" "$plist"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$NATIVE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$NATIVE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.voilelab.plainshelf"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0.0"
          test "$(vtool -show-build build/bin/PlainShelf.app/Contents/MacOS/plainshelf | awk '$1 == "minos" {print $2}')" = "13.0"

      - name: Package .app as zip
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="plainshelf-desktop_${VERSION}_darwin_arm64"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            desktop/build/bin/PlainShelf.app "out/${name}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-desktop-darwin-arm64
          path: out/*
          if-no-files-found: error

  reader-mac:
    name: Build reader darwin/arm64
    needs: [prepare, frontend, test]
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: reader/go.mod
          cache: true
          cache-dependency-path: reader/go.sum

      - name: Build Wails .app
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          NATIVE_VERSION: ${{ needs.prepare.outputs.native_version }}
        working-directory: reader
        run: |
          set -euo pipefail
          go mod tidy
          go tool wails3 task package:darwin VERSION="${VERSION}"

          plist="build/bin/PlainShelfReader.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${NATIVE_VERSION}" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${NATIVE_VERSION}" "$plist"
          plutil -lint "$plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$NATIVE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$NATIVE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "com.voilelab.plainshelf-reader"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = "13.0.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeIdentifier' "$plist")" = "com.voilelab.plainshelf.bookpkg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' "$plist")" = "bookpkg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$plist")" = "com.voilelab.plainshelf.bookpkg"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSTypeIsPackage' "$plist")" = "true"

      - name: Package .app as zip
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          name="bookpkg-reader_${VERSION}_darwin_arm64"
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent \
            reader/build/bin/PlainShelfReader.app "out/${name}.zip"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-bookpkg-reader-darwin-arm64
          path: out/*
          if-no-files-found: error

  android-lib:
    name: Build Android Go library
    needs: [frontend, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build and measure the library
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build-android-lib.sh build/android-lib

      - name: Upload library
        uses: actions/upload-artifact@v7
        with:
          name: android-lib
          path: build/android-lib/plainshelf.aar
          if-no-files-found: error

  android:
    name: Build Android arm64 APK
    needs: [prepare, frontend, android-lib]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download Android Go library
        uses: actions/download-artifact@v8
        with:
          name: android-lib
          path: frontend/android/app/libs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync the web build into the Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ inputs.publish == true }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is not set; a published APK must be signed"
              exit 1
            fi
            echo "No signing keystore; building an unsigned APK"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "PLAINSHELF_KEYSTORE_FILE=${keystore}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: frontend/android
        env:
          PLAINSHELF_VERSION_NAME: ${{ needs.prepare.outputs.android_name }}
          PLAINSHELF_VERSION_CODE: ${{ needs.prepare.outputs.android_code }}
          PLAINSHELF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAINSHELF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAINSHELF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify and package APK
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ANDROID_NAME: ${{ needs.prepare.outputs.android_name }}
          ANDROID_CODE: ${{ needs.prepare.outputs.android_code }}
        run: |
          set -euo pipefail
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk_dir=frontend/android/app/build/outputs/apk/release
          name="plainshelf-android_${VERSION}_arm64"
          if [ -n "${PLAINSHELF_KEYSTORE_FILE:-}" ]; then
            apk="${apk_dir}/app-release.apk"
            "$build_tools/apksigner" verify --print-certs "$apk"
          else
            apk="${apk_dir}/app-release-unsigned.apk"
            name="${name}-unsigned"
          fi

          badging=$("$build_tools/aapt2" dump badging "$apk")
          grep -q "^package: name='lab.voile.plainshelf' versionCode='${ANDROID_CODE}' versionName='${ANDROID_NAME}'" <<<"$badging"
          test "$(sed -n "s/^native-code: //p" <<<"$badging")" = "'arm64-v8a'"

          mkdir -p out
          cp "$apk" "out/${name}.apk"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: plainshelf-android-arm64
          path: out/*
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    needs: [prepare, test, release]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.publish == true && !contains(needs.prepare.outputs.version, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.publish == true }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}

  release:
    name: Publish GitHub Release
    needs: [prepare, binaries, desktop-mac, reader-mac, android]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # actions/checkout@v7 fetches one commit and no tags by default (action README).
          fetch-depth: 0

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: plainshelf-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REF: ${{ inputs.ref }}
        run: ./scripts/release-notes.sh "$VERSION" "$REF" > release-notes.md

      # GitHub Actions does not start workflows from tag-push events performed with GITHUB_TOKEN (Triggering a workflow).
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ inputs.ref }}
          name: ${{ needs.prepare.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: dist/*
