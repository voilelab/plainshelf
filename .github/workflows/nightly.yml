name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  NPM_CONFIG_PREFER_OFFLINE: "true"
  NPM_CONFIG_FETCH_TIMEOUT: "30000"
  NPM_CONFIG_FETCH_RETRIES: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "1000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "10000"
  NPM_CONFIG_LOGLEVEL: http

jobs:
  e2e-full:
    name: Full E2E suite
    runs-on: ubuntu-latest
    if: github.repository == 'voilelab/plainshelf'
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 3
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run the full E2E suite
        working-directory: e2e
        env:
          E2E_BROWSERS: chromium,webkit
        run: npm test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-results
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # GitHub Actions github.sha describes the triggering event; actions/checkout@v7 can check out a different ref (Events that trigger workflows; checkout README).
          commit_sha=$(git rev-parse HEAD)
          title='Nightly E2E suite is failing on dev'
          body=$(printf '%s\n' \
            'The full E2E suite failed on `dev`.' \
            '' \
            "- Run: $RUN_URL" \
            "- Commit: \`$commit_sha\`" \
            '' \
            'The pull request gate only runs the `@smoke` subset, so this is a failure no' \
            'pull request would have caught. `docs/development/testing-levels.md` has the' \
            'two tiers, and R6 says what to do with a test that fails intermittently.')
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  wasm-demo-browsers:
    name: Wasm demo in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    if: github.repository == 'voilelab/plainshelf'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
        include:
          - browser: webkit
            expect-memory: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'dev' }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frontend dependencies
        working-directory: frontend
        timeout-minutes: 3
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        timeout-minutes: 3
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build wasm demo
        run: cmd/plainshelf-wasm/build.sh workspace/wasm-demo

      - name: Run wasm demo smoke test
        env:
          SMOKE_BROWSER: ${{ matrix.browser }}
          SMOKE_EXPECT_MEMORY: ${{ matrix.expect-memory }}
        run: node cmd/plainshelf-wasm/web/smoke.mjs workspace/wasm-demo wasm-demo.png

      - name: Upload screenshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-demo-${{ matrix.browser }}-screenshot
          path: wasm-demo.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Report the failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse HEAD)
          title="Nightly wasm demo smoke is failing in $BROWSER"
          body=$(printf '%s\n' \
            "The wasm demo smoke test failed in $BROWSER on \`dev\`." \
            '' \
            "- Run: $RUN_URL" \
            "- Commit: \`$commit_sha\`" \
            '' \
            'The pull request gate only runs it in chromium, so this is a failure no' \
            'pull request would have caught. See `cmd/plainshelf-wasm/README.md`.')
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
