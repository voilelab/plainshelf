# Backs the "Dependency Updates" section of SECURITY.md: this file lands the
# fix, while ci.yml's scan jobs report what is currently vulnerable.
#
# The repository default branch is `dev`, so these pull requests target `dev`
# without a `target-branch` override — which also keeps Dependabot's own
# security updates enabled, as those only ever open against the default branch.
#
# internal/repocheck/dependabot_test.go fails if a manifest here goes uncovered.
version: 2

updates:
  # Three Go modules, the same split as ci.yml's lint, test and scan jobs.
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/desktop"
      - "/reader"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One pull request per module per week, not one per dependency.
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - "/frontend"
      - "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Majors stay ungrouped: they need the changelog read before merging.
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # TypeScript 7 is the Go rewrite: its package `exports` drop the JS
      # compiler API, so `vue-tsc` cannot resolve `typescript/lib/tsc` and
      # `npm run build` dies before type-checking anything. Nothing in the
      # frontend can move until vue-tsc ships a native-compiler backend, so
      # majors stay ignored; minors and patches still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # `@types/node` majors track Node.js majors, and docs/development/setup.md
      # caps the frontend at Node.js 23: from 26 the runtime's own experimental
      # `localStorage` global breaks the Vitest suite. Typing the tooling against
      # a Node.js the project cannot run on hides missing-API errors, so majors
      # stay ignored until that supported range moves.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  # The `FROM` images only. The pinned NODE_VERSION and GO_VERSION build args in
  # the Dockerfile are invisible to Dependabot and still move by hand.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"

  # requirements.txt is what docs.yml builds the published site from.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      docs:
        patterns:
          - "*"
