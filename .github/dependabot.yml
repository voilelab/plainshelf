# Backs the "Dependency Updates" section of SECURITY.md: Dependabot opens pull
# requests only for security advisories, while ci.yml's vulncheck job reports
# what is currently vulnerable.
#
# `open-pull-requests-limit: 0` turns off routine version updates — they were
# review noise — but not security updates, which GitHub opens regardless of the
# limit and the schedule. The entries stay so security updates still cover every
# manifest and still honour the `ignore` rules below. `schedule` is required by
# the file format even though nothing runs on it.
#
# The repository default branch is `dev`, so these pull requests target `dev`
# without a `target-branch` override — which also keeps Dependabot's own
# security updates enabled, as those only ever open against the default branch.
#
# internal/repocheck/dependabot_test.go fails if a manifest here goes uncovered
# or an entry other than docker turns version updates back on.
version: 2

updates:
  # Three Go modules, the same split as ci.yml's lint, test and scan jobs.
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/desktop"
      - "/reader"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # TypeScript 7 is the Go rewrite: its package `exports` drop the JS
      # compiler API, so `vue-tsc` cannot resolve `typescript/lib/tsc` and
      # `npm run build` dies before type-checking anything. Nothing in the
      # frontend can move until vue-tsc ships a native-compiler backend.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

      # `@types/node` majors track Node.js majors, and docs/development/setup.md
      # caps the frontend at Node.js 23: from 26 the runtime's own experimental
      # `localStorage` global breaks the Vitest suite.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"

  # The one entry left on version updates: GitHub's advisory database has no
  # Docker ecosystem, so security updates never fire here. The only `FROM` is an
  # unpinned `ubuntu:24.04` that every release build already pulls fresh, so
  # this opens a pull request only for the next LTS. The pinned NODE_VERSION and
  # GO_VERSION build args are invisible to Dependabot and still move by hand.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(ci)"

  # requirements.txt is what docs.yml builds the published site from.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
