logger:
  level: info  # log level: debug, info, warn, error
  format: json # log format: json, text
  log_file:
    type: stderr

server_conf:
  addr: "0.0.0.0:20000"
  read_timeout: 60s
  write_timeout: 60s

app_conf:
  logger:
    level: info  # log level: debug, info, warn, error
    format: json # log format: json, text
    log_file:
      type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
      dir: /data/logs
      prefix: root
      # Rotated files older than this are deleted on the next rotation.
      # Defaults to 30 days; set to 0 to keep every file. A value saved from
      # Settings -> Logs takes precedence over this one.
      # retention_days: 30
  shelves:
    - id: default_shelf
      name: Default Shelf
      logger:
        level: info  # log level: debug, info, warn, error
        format: json # log format: json, text
        log_file:
          type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
          dir: /data/logs
          prefix: shelf
          # Rotated files older than this are deleted on the next rotation.
          # Defaults to 30 days; set to 0 to keep every file. A value saved from
          # Settings -> Logs takes precedence over this one.
          # retention_days: 30
      lib_root: "/data/shelf"
  store_path: "/data/store"
  cover_to_jpg: true
  read_only: false
  security:
    # local_token makes the shipped image reject unauthenticated writes on its own:
    # mutating /api requests (POST/PUT/PATCH/DELETE) require the token the server
    # injects into the served index page, so a browser opened against the container
    # needs no manual setup. Loopback port publishing (-p 127.0.0.1:20000:20000) is
    # now a recommendation, not the only line of defence.
    mode: "local_token"
    # Switch to "none" only when an authentication boundary already sits in front of
    # PlainShelf -- reverse proxy auth or a VPN edge. It disables the API token gate
    # entirely, so an exposed port becomes an anonymous read/write/delete shelf.
    # mode: "none"
    #
    # local_token allows only loopback browser origins by default
    # (http://127.0.0.1:20000, http://localhost:20000). If you open the UI from a LAN
    # IP (e.g. a NAS) or a custom domain, list those origins here or the Origin check
    # will reject writes:
    # allowed_origins:
    #   - "http://192.168.1.10:20000"
    #   - "https://plainshelf.example.com"
