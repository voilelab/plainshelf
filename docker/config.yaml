logger:
  level: info  # log level: debug, info, warn, error
  format: json # log format: json, text
  log_file:
    type: stderr

server_conf:
  addr: "0.0.0.0:20000"
  read_timeout: 60s
  write_timeout: 60s

app_conf:
  logger:
    level: info  # log level: debug, info, warn, error
    format: json # log format: json, text
    log_file:
      type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
      dir: /data/logs
      prefix: root
  shelves:
    - id: default_shelf
      name: Default Shelf
      logger:
        level: info  # log level: debug, info, warn, error
        format: json # log format: json, text
        log_file:
          type: filename_rotate # log file type: stdout, stderr, none, filename, filename_rotate
          dir: /data/logs
          prefix: shelf
      lib_root: "/data/shelf"
  store_path: "/data/store"
  cover_to_jpg: true
  read_history_limit: 100
  security:
    # Explicitly unsafe for container deployments; put PlainShelf behind a trusted
    # local-only port mapping, reverse proxy auth, VPN boundary, or future password mode.
    mode: "none"
