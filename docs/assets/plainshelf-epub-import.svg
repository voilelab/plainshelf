<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plainshelf-epub-import-title plainshelf-epub-import-desc">
      <title id="plainshelf-epub-import-title">EPUB Import Pipeline</title>
      <desc id="plainshelf-epub-import-desc">An uploaded EPUB is parsed and rendered to Markdown or plain text before any lock is taken; only the write step runs under the exclusive shelf lock, producing a book package holding the converted text, cover and metadata. The original archive is never stored.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66758a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6feb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f4f6f8"/>

      <rect x="168" y="56" width="752" height="104" fill="rgba(20,32,51,0.018)"/>

      <rect x="168" y="264" width="752" height="104" fill="rgba(20,32,51,0.018)"/>

      <line x1="40" y1="56" x2="920" y2="56" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <line x1="40" y1="160" x2="920" y2="160" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <line x1="40" y1="264" x2="920" y2="264" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <line x1="40" y1="368" x2="920" y2="368" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <line x1="40" y1="472" x2="920" y2="472" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <line x1="168" y1="56" x2="168" y2="472" stroke="rgba(20,32,51,0.20)" stroke-width="1"/>

      <text x="104" y="104" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">CLIENT</text>

      <text x="104" y="118" fill="#8d99ab" font-size="7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">web &#183; desktop</text>

      <text x="104" y="208" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">SERVER</text>

      <text x="104" y="222" fill="#8d99ab" font-size="7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">import_epub.go</text>

      <text x="104" y="312" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">EPUB</text>

      <text x="104" y="326" fill="#8d99ab" font-size="7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">internal/epub</text>

      <text x="104" y="416" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.10em">SHELF</text>

      <text x="104" y="430" fill="#8d99ab" font-size="7" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">shelf &#183; disk</text>

      <path d="M 236,136 V 160 Q 236,168 244,168 H 380 Q 388,168 388,176 V 184" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 388,240 V 264 Q 388,272 396,272 H 532 Q 540,272 540,280 V 288" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 600,316 H 632" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 692,344 V 392" fill="none" stroke="#1f6feb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="700" y="356" width="64" height="12" rx="2" fill="#f4f6f8"/>
      <text x="700" y="364" fill="#1a5ecc" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" letter-spacing="0.06em">TAKES LOCK</text>

      <path d="M 752,420 H 784" fill="none" stroke="#1f6feb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <path d="M 752,316 H 784" fill="none" stroke="#66758a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <rect x="176" y="80" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="176" y="80" width="120" height="56" rx="6" fill="rgba(102,117,138,0.10)" stroke="#8d99ab" stroke-width="1"/>
      <text x="236" y="106" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Upload .epub</text>
      <text x="236" y="120" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">multipart POST</text>

      <rect x="328" y="184" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="328" y="184" width="120" height="56" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="388" y="210" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">importEPUB</text>
      <text x="388" y="224" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">reads strategy</text>

      <rect x="480" y="288" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="480" y="288" width="120" height="56" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="540" y="314" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">epub.Parse</text>
      <text x="540" y="328" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">zip &#183; OPF &#183; spine</text>

      <rect x="632" y="288" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="632" y="288" width="120" height="56" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="692" y="314" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">epub.Render</text>
      <text x="692" y="328" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">md or txt</text>

      <rect x="784" y="288" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="784" y="288" width="120" height="56" rx="6" fill="rgba(20,32,51,0.02)" stroke="rgba(20,32,51,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="844" y="314" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">original .epub</text>
      <text x="844" y="328" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">never stored</text>

      <rect x="632" y="392" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="632" y="392" width="120" height="56" rx="6" fill="rgba(31,111,235,0.08)" stroke="#1f6feb" stroke-width="1"/>
      <text x="692" y="418" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">NewBookWith</text>
      <text x="692" y="432" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">exclusive lock</text>

      <rect x="784" y="392" width="120" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="784" y="392" width="120" height="56" rx="6" fill="rgba(20,32,51,0.05)" stroke="#66758a" stroke-width="1"/>
      <text x="844" y="418" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">.bookpkg</text>
      <text x="844" y="432" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">text &#183; cover &#183; meta</text>

      <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>
      <text x="40" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="104" y="548" width="12" height="12" rx="2" fill="rgba(102,117,138,0.10)" stroke="#8d99ab" stroke-width="1"/>
      <text x="124" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Upload</text>
      <rect x="216" y="548" width="12" height="12" rx="2" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="236" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Pipeline step</text>
      <rect x="344" y="548" width="12" height="12" rx="2" fill="rgba(31,111,235,0.08)" stroke="#1f6feb" stroke-width="1"/>
      <text x="364" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Under exclusive lock</text>
      <rect x="512" y="548" width="12" height="12" rx="2" fill="rgba(20,32,51,0.05)" stroke="#66758a" stroke-width="1"/>
      <text x="532" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Written to disk</text>
      <rect x="664" y="548" width="12" height="12" rx="2" fill="rgba(20,32,51,0.02)" stroke="rgba(20,32,51,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="684" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Not stored</text>
    </svg>
