<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plainshelf-architecture-title plainshelf-architecture-desc">
      <title id="plainshelf-architecture-title">PlainShelf System Architecture</title>
      <desc id="plainshelf-architecture-desc">Web, desktop, and Android clients reach a local Go server behind a local-token boundary, where a shelf manager keeps an in-memory book cache over the shelf filesystem that holds the library; a separate key-value store holds app settings, and the Android client can also read a pCloud-hosted shelf directly as a read-only backend.</desc>
