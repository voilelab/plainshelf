<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plainshelf-device-storage-title plainshelf-device-storage-desc">
      <title id="plainshelf-device-storage-title">Device-Local Reading State</title>
      <desc id="plainshelf-device-storage-desc">Three feature documents — reading progress, read history and reading stats — all mutate through one queued device document store, which narrows to a single format-blind interface that only loads and saves a plain string. Four platform backends implement it: browser localStorage, Capacitor Filesystem in app-private storage on Android, a JSON file beside shelves.json on the Wails desktop, and an in-memory store for mock mode and unit tests.</desc>
