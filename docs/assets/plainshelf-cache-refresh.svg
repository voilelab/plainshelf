<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="plainshelf-cache-refresh-title plainshelf-cache-refresh-desc">
      <title id="plainshelf-cache-refresh-title">Shelf Cache Refresh</title>
      <desc id="plainshelf-cache-refresh-desc">Every book or layer listing passes three gates: a shelf still building its first cache refuses the read with 503; a structurally dirty tree or an elapsed scan interval triggers a full synchronous walk that blocks the caller; otherwise an elapsed book-check interval spawns a background per-book stat that does not block. In every surviving case the answer itself comes from the in-memory cache.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#66758a"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1f6feb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f4f6f8"/>

      <path d="M 260,96 V 128" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M 380,168 H 520" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="400" y="148" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="414" y="156" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <path d="M 260,208 V 240" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="268" y="212" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="282" y="220" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <path d="M 380,280 H 520" fill="none" stroke="#1f6feb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <rect x="400" y="260" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="414" y="268" fill="#1a5ecc" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <path d="M 260,320 V 352" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="268" y="324" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="282" y="332" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <path d="M 380,392 H 520" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="400" y="372" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="414" y="380" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>

      <path d="M 260,432 V 480 Q 260,488 268,488 H 300" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="268" y="440" width="28" height="12" rx="2" fill="#f4f6f8"/>
      <text x="282" y="448" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>

      <path d="M 840,280 H 892 Q 900,280 900,288 V 448 Q 900,456 892,456 H 684" fill="none" stroke="#1f6feb" stroke-width="1.2"/>

      <path d="M 680,420 V 452" fill="none" stroke="#66758a" stroke-width="1" stroke-dasharray="4,3"/>

      <rect x="688" y="428" width="88" height="12" rx="2" fill="#f4f6f8"/>
      <text x="688" y="436" fill="#8d99ab" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="start" letter-spacing="0.06em">DOESN'T BLOCK</text>

      <path d="M 680,460 V 480 Q 680,488 672,488 H 620" fill="none" stroke="#66758a" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="140" y="56" width="240" height="40" rx="20" fill="#f4f6f8"/>
      <rect x="140" y="56" width="240" height="40" rx="20" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="260" y="80" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">List books or layers</text>

      <polygon points="260,128 380,168 260,208 140,168" fill="#f4f6f8"/>
      <polygon points="260,128 380,168 260,208 140,168" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="260" y="164" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Still initializing?</text>
      <text x="260" y="178" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">ListBooks only</text>

      <rect x="520" y="144" width="320" height="48" rx="6" fill="#f4f6f8"/>
      <rect x="520" y="144" width="320" height="48" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="680" y="166" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Refuse the read</text>
      <text x="680" y="180" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">503 &#183; Retry-After: 3</text>

      <polygon points="260,240 380,280 260,320 140,280" fill="#f4f6f8"/>
      <polygon points="260,240 380,280 260,320 140,280" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="260" y="276" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Full scan due?</text>
      <text x="260" y="290" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">treeDirty | scan_interval</text>

      <rect x="520" y="252" width="320" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="520" y="252" width="320" height="56" rx="6" fill="rgba(31,111,235,0.08)" stroke="#1f6feb" stroke-width="1"/>
      <text x="680" y="274" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Full walk of books/</text>
      <text x="680" y="288" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">synchronous &#183; blocks caller</text>

      <polygon points="260,352 380,392 260,432 140,392" fill="#f4f6f8"/>
      <polygon points="260,352 380,392 260,432 140,392" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="260" y="388" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Book check due?</text>
      <text x="260" y="402" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">book_check_interval</text>

      <rect x="520" y="364" width="320" height="56" rx="6" fill="#f4f6f8"/>
      <rect x="520" y="364" width="320" height="56" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="680" y="386" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Stat each cached book.json</text>
      <text x="680" y="400" fill="#66758a" font-size="9" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" text-anchor="middle">async goroutine &#183; shared lock</text>

      <circle cx="680" cy="456" r="4" fill="#142033"/>

      <rect x="300" y="468" width="320" height="40" rx="20" fill="#f4f6f8"/>
      <rect x="300" y="468" width="320" height="40" rx="20" fill="#ffffff" stroke="#142033" stroke-width="1"/>
      <text x="460" y="492" fill="#142033" font-size="12" font-weight="600" font-family="'Avenir Next','Segoe UI',system-ui,sans-serif" text-anchor="middle">Serve from memory</text>

      <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(20,32,51,0.12)" stroke-width="0.8"/>

      <text x="40" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="104" y="548" width="20" height="12" rx="6" fill="#ffffff" stroke="#142033" stroke-width="1"/>

      <text x="132" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Start / end</text>

      <polygon points="230,548 240,554 230,560 220,554" fill="#ffffff" stroke="#142033" stroke-width="1"/>

      <text x="248" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Decision</text>

      <rect x="320" y="548" width="20" height="12" rx="2" fill="#ffffff" stroke="#142033" stroke-width="1"/>

      <text x="348" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Step</text>

      <rect x="400" y="548" width="20" height="12" rx="2" fill="rgba(31,111,235,0.08)" stroke="#1f6feb" stroke-width="1"/>

      <text x="428" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Blocks the caller</text>

      <circle cx="570" cy="554" r="4" fill="#142033"/>

      <text x="584" y="560" fill="#66758a" font-size="8" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">Branches rejoin</text>
