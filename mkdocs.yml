site_name: PlainShelf
site_description: A local-first personal reading library for lightweight reading content
repo_url: https://github.com/voilelab/plainshelf
repo_name: voilelab/plainshelf

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

# Agent instructions stay in the repository, outside the published user docs.
exclude_docs: |
  /development/agent/

nav:
  - Home: index.md
  - Try the demo: try-the-demo.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - EPUB import: epub-import.md
  - Finding similar books: finding-similar-books.md
  - Logs: logs.md
  - Backup & restore: backup-and-restore.md
  - Deployment & threat model: deployment-and-threat-model.md
  - Configuration:
      - Configuration reference: reference/configuration.md
      - Local shelf file source: configuring-local-shelf.md
      - SMB shelf file source: configuring-smb-shelf.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Data model: concepts/data-model.md
      - Data format versioning: concepts/data-format-versioning.md
      - Shelf cache and disk I/O: concepts/shelf-cache-and-io.md
      - Folders: concepts/folders.md
      - Shelf sources and credentials: concepts/shelf-sources.md
      - Shelf and platform capabilities: concepts/platform-capabilities.md
      - Similarity fingerprints: concepts/similarity-fingerprints.md
  - Development:
      - Local Setup: development/setup.md
      - Android: development/android.md
      - Docker: development/docker.md
      - Testing Levels: development/testing-levels.md
      - Mutation Testing: development/mutation-testing.md
      - Releasing: development/releasing.md
  - Known issues: known-issue.md

# A missing in-page anchor is only INFO by default, which --strict lets through.
validation:
  anchors: warn
